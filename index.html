<h2>内蔵データ</h2>
<div id="ports"></div>
<p class="mut">グラフは天文潮位です。広島・呉・松山は気象庁の毎時潮位表（2026〜2027年）をそのまま使っています。気圧や風の影響で実際の潮位とは異なります。時間差・潮位差は、釣りをしながら実際の様子に合わせて調整してください。</p>
<p class="mut">出典：気象庁ホームページ「潮位表」（広島・呉・松山、2026〜2027年）を加工して作成。釣りの際は、天気や波浪などの最新の情報も確認し、安全に行動してください。</p>

s+='<g class="tip" style="display:none" pointer-events="none"><line y1="'+T+'" y2="'+pb+'" stroke="var(--fg)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/><circle r="5" fill="var(--card)" stroke="var(--seaLine)" stroke-width="2.5"/><rect rx="5" fill="var(--card)" stroke="var(--seaLine)"/><text font-size="13" font-weight="600" fill="var(--fg)" text-anchor="middle" dominant-baseline="central"></text></g>';
let nw=null;if(now>=d0&&now<d1){const i0=Math.floor((now-d0)/6e5),A=v[i0],B=v[i0+1];if(A&&B&&A[1]!=null&&B[1]!=null){const hh=A[1]+(B[1]-A[1])*((now-A[0])/6e5);nw={px:X(now),py:Y(hh),str:hm(now)+'　'+Math.round(hh)+'cm'}}}
CH.set(sp,{d0,v,W,H,L,R,T,pb,X,Y,now:nw});
if(nw)s+='<g class="nowtip" pointer-events="none"><circle r="5" fill="var(--card)" stroke="var(--now)" stroke-width="2.5"/><rect rx="5" fill="var(--card)" stroke="var(--now)"/><text font-size="13" font-weight="600" fill="var(--fg)" text-anchor="middle" dominant-baseline="central"></text></g>';
return s+'</svg>'}

function elong(t){const d=t/864e5+2440587.5-2451545,r=Math.PI/180,Lm=218.316+13.176396*d,Mm=134.963+13.064993*d,Ls=280.460+.9856474*d,Ms=357.529+.9856003*d,D=(Lm-Ls)*r,ml=Lm+6.289*Math.sin(Mm*r)+1.274*Math.sin(2*D-Mm*r)+.658*Math.sin(2*D)-.186*Math.sin(Ms*r),sl=Ls+1.915*Math.sin(Ms*r)+.02*Math.sin(2*Ms*r);let e=(ml-sl)%360;if(e>180)e-=360;if(e<-180)e+=360;return e}
const NM=['大潮','大潮','大潮','中潮','中潮','中潮','小潮','小潮','小潮','長潮','若潮','中潮','中潮','中潮','大潮','大潮','大潮','大潮','中潮','中潮','中潮','小潮','小潮','小潮','長潮','若潮','中潮','中潮','中潮','大潮'];
function moonInfo(t){let tn=t-((elong(t)+360)%360)/12.19*864e5;for(let i=0;i<5;i++)tn-=elong(tn)/12.19*864e5;const age=(t-tn)/864e5;return{age,name:NM[Math.min(29,Math.floor(age))]}}
function render(){$('#date').value=S.date;const mi=moonInfo(dayStart()+432e5),dd=new Date(dayStart());$('#info').innerHTML=(dd.getMonth()+1)+'月'+dd.getDate()+'日（'+'日月火水木金土'[dd.getDay()]+'）　'+mi.name+'<span>月齢 '+mi.age.toFixed(1)+'</span>';
const ports=PORTS;
$('#spots').innerHTML=S.spots.map((sp,i)=>'<section class="spot" data-i="'+i+'"><button class="pin" data-pin="'+i+'"'+(i===0?' disabled':'')+' aria-label="'+esc(sp.name)+'を最上位に移動" title="最上位に移動">▲</button><div class="top"><input class="nm" data-f="name" value="'+esc(sp.name)+'" aria-label="釣り場の名前">'
+'<label class="s">基準港<select data-f="port">'+ports.map(p=>'<option'+(p===sp.port?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select></label>'
+'<button data-del="'+i+'" aria-label="削除">削除</button>'+adj('満潮','H',sp,'h')+adj('干潮','L',sp,'l')+locRow(sp)

+'</div>'+chart(sp)+'</section>').join('');layoutNow();
$('#ports').innerHTML=ports.map(p=>'<div class="mut">'+esc(p)+'：2026/1/1〜2027/12/31（気象庁の潮位表）</div>').join('')}

$('#spots').addEventListener('change',e=>{const f=e.target.dataset.f,i=e.target.closest('.spot')?.dataset.i;if(!f||i==null)return;
S.spots[i][f]=(f==='gH'||f==='gL')?(Number(e.target.value)>0?Number(e.target.value):1):(f!=='name'&&f!=='port'&&f!=='loc')?(Number(e.target.value)||0):e.target.value;save();render()});
function layoutNow(){document.querySelectorAll('.spot').forEach(sec=>{const c=CH.get(S.spots[sec.dataset.i]),g=sec.querySelector('.nowtip');if(!c||!c.now||!g)return;
 const[ci,rc,tx]=g.children,{px,py,str}=c.now;ci.setAttribute('cx',px);ci.setAttribute('cy',py);
 tx.textContent=str;tx.setAttribute('x',0);tx.setAttribute('y',0);
 const bb=tx.getBBox(),w=bb.width+18,h=bb.height+10,bx=Math.min(Math.max(px,c.L+w/2+2),c.W-c.R-w/2-2),by=py-16-h>c.T+2?py-16-h:py+16;
 rc.setAttribute('x',bx-w/2);rc.setAttribute('y',by);rc.setAttribute('width',w);rc.setAttribute('height',h);tx.setAttribute('x',bx);tx.setAttribute('y',by+h/2)})}
function syncNow(){document.querySelectorAll('.spot').forEach(sec=>{const t=sec.querySelector('.tip'),n=sec.querySelector('.nowtip');if(t&&n)n.style.display=t.style.display==='none'?'':'none'})}
const tipHide=root=>(root||document).querySelectorAll('.tip').forEach(g=>g.style.display='none');
function tipMove0(e){const svg=e.target.closest&&e.target.closest('svg');if(!svg){return}
 const sec=svg.closest('.spot'),c=sec&&CH.get(S.spots[sec.dataset.i]);if(!c)return;
 document.querySelectorAll('.tip').forEach(g=>{if(!svg.contains(g))g.style.display='none'});
 const g=svg.querySelector('.tip'),r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*c.W;
 if(x<c.L||x>c.W-c.R){g.style.display='none';return}
 const i=Math.round((c.d0+(x-c.L)/(c.W-c.L-c.R)*D-c.d0)/6e5),p=c.v[i];
 if(!p||p[1]==null){g.style.display='none';return}
 const px=c.X(p[0]),py=c.Y(p[1]),[ln,ci,rc,tx]=g.children;
 g.style.display='';
 ln.setAttribute('x1',px);ln.setAttribute('x2',px);ci.setAttribute('cx',px);ci.setAttribute('cy',py);
 tx.textContent=hm(p[0])+'　'+Math.round(p[1])+'cm';tx.setAttribute('x',0);tx.setAttribute('y',0);
 const bb=tx.getBBox(),w=bb.width+18,h=bb.height+10,bx=Math.min(Math.max(px,c.L+w/2+2),c.W-c.R-w/2-2),by=py-16-h>c.T+2?py-16-h:py+16;
 rc.setAttribute('x',bx-w/2);rc.setAttribute('y',by);rc.setAttribute('width',w);rc.setAttribute('height',h);
 tx.setAttribute('x',bx);tx.setAttribute('y',by+h/2)}
const tipMove=e=>{tipMove0(e);syncNow()};
$('#spots').addEventListener('pointermove',tipMove);
$('#spots').addEventListener('pointerdown',tipMove);
$('#spots').addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){tipHide();syncNow()}});
$('#spots').addEventListener('click',e=>{const pi=e.target.dataset.pin;if(pi!=null){const[x]=S.spots.splice(+pi,1);S.spots.unshift(x);save();render();return}const i=e.target.dataset.del;if(i==null)return;S.spots.splice(i,1);save();render()});
$('#add').onclick=()=>{S.spots.push({name:'新しい釣り場',port:PORTS[0],dtH:0,dtL:0,dhH:0,dhL:0});save();render()};
const shift=n=>{const[y,m,d]=S.date.split('-').map(Number);S.date=ds(new Date(y,m-1,d+n));render()};
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#today').onclick=()=>{S.date=ds(new Date());render()};
$('#date').onchange=e=>{if(e.target.value){S.date=e.target.value;render()}};
render();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
</script>
